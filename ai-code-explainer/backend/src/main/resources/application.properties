# Server port (the frontend calls http://localhost:8080)
server.port=${PORT:8080}
spring.application.name=code-explainer

# Gemini settings.
# The key is read from the GEMINI_API_KEY environment variable.
# It is NOT written here, so it never ends up in Git or in the frontend.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-2.5-flash

# Reject very large request bodies
server.tomcat.max-http-form-post-size=1MB
